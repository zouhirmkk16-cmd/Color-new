<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battery Color AI Customizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-accent: #3b82f6;
            --snap-black: #000000;
            --bg-chat: #09090b;
            --bg-workspace: #020202;
            --bg-bubble-user: #1c1c1e;
            --border-color: #27272a;
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --chat-btn-bg: #0c0c0e;
            --chat-btn-border: #1e1e22;
            --menu-bg: rgba(9, 9, 11, 0.95);
            --alert-bg: rgba(20, 20, 25, 0.85);
            --alert-border: rgba(59, 130, 246, 0.4);
            --glow-color: rgba(59, 130, 246, 0.2);
        }

        [data-theme="light"] {
            --bg-chat: #f4f4f5;
            --bg-workspace: #e4e4e7;
            --bg-bubble-user: #e4e4e7;
            --border-color: #d4d4d8;
            --text-main: #09090b;
            --text-muted: #52525b;
            --chat-btn-bg: #ffffff;
            --chat-btn-border: #e4e4e7;
            --menu-bg: rgba(244, 244, 245, 0.95);
            --alert-bg: rgba(255, 255, 255, 0.9);
            --alert-border: rgba(59, 130, 246, 0.3);
            --glow-color: rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            font-weight: 700;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-workspace);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh; 
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* --- Header & Layout --- */
        .live-status-bar {
            background: rgba(12, 12, 14, 0.85);
            border-bottom: 1px solid var(--border-color);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 12px;
            color: var(--text-muted);
            z-index: 90;
            position: relative;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
            animation: pulseDot 1.8s infinite;
        }

        @keyframes pulseDot {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        .status-text strong {
            color: var(--primary-accent);
            font-weight: 800;
        }

        .chat-container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-chat);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh; 
            position: relative;
            overflow: hidden;
        }

        .chat-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-chat);
            z-index: 99;
            position: relative;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ai-brand {
            font-weight: 800;
            font-size: 22px;
            letter-spacing: -0.5px;
        }
        .ai-brand .part-highlight { color: var(--primary-accent); }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lang-wrapper { position: relative; }
        .lang-btn {
            background: var(--chat-btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 13px;
            padding: 0 12px;
            height: 36px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-radius: 10px;
            cursor: pointer;
        }

        .lang-dropdown {
            position: absolute;
            top: 42px;
            right: 0;
            background: var(--menu-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: none;
            flex-direction: column;
            z-index: 1001;
            min-width: 120px;
        }

        .lang-opt {
            padding: 10px 14px;
            color: var(--text-main);
            font-size: 13px;
            cursor: pointer;
        }
        .lang-opt:hover { background: var(--bg-bubble-user); color: var(--primary-accent); }

        .theme-btn {
            background: var(--chat-btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 16px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            cursor: pointer;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 5;
        }

        .chat-row { display: flex; gap: 12px; max-width: 100%; }
        .chat-row.user-row { flex-direction: row-reverse; }

        .bot-avatar {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: #ffffff;
            font-size: 16px;
        }

        .msg-bubble {
            font-size: 15px;
            line-height: 1.6;
            max-width: 88%;
            color: var(--text-main);
            padding-top: 4px;
            font-weight: 600;
        }

        .user-row .msg-bubble {
            background: var(--bg-bubble-user);
            padding: 12px 18px;
            border-radius: 18px 4px 18px 18px;
            max-width: 75%;
            border: 1px solid var(--border-color);
            font-weight: 700;
        }

        /* --- Custom Interactive Components --- */
        .device-selector-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 14px;
            width: 100%;
        }

        .device-btn {
            background: var(--chat-btn-bg);
            border: 1px solid var(--chat-btn-border);
            color: var(--text-main);
            padding: 16px 12px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .device-btn i { font-size: 24px; color: var(--primary-accent); }
        .device-btn:hover { border-color: var(--primary-accent); transform: translateY(-2px); }

        /* Battery Live Preview Box Inside Chat */
        .battery-preview-card {
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 20px;
            margin-top: 14px;
            text-align: center;
        }

        .battery-wrapper {
            width: 130px;
            height: 55px;
            border: 4px solid #ffffff;
            border-radius: 12px;
            margin: 0 auto 16px;
            padding: 4px;
            position: relative;
        }

        .battery-wrapper::after {
            content: '';
            position: absolute;
            right: -11px;
            top: 50%;
            transform: translateY(-50%);
            width: 5px;
            height: 20px;
            background: #ffffff;
            border-radius: 0 4px 4px 0;
        }

        .battery-fill {
            width: 85%;
            height: 100%;
            background: #3b82f6;
            border-radius: 6px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px #3b82f6;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .color-opt {
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .color-opt:hover { transform: scale(1.05); }
        .color-opt.active { border-color: #ffffff; transform: scale(1.05); }

        .c-blue { background: #3b82f6; }
        .c-purple { background: #8b5cf6; }
        .c-pink { background: #ec4899; }
        .c-red { background: #ef4444; }
        .c-orange { background: #f97316; }
        .c-green { background: #10b981; }
        .c-cyan { background: #06b6d4; }
        .c-yellow { background: #eab308; }

        .action-confirm-btn {
            width: 100%;
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        /* Progress & Terminal */
        .terminal-log-box {
            background: #020205;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            margin-top: 14px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: #e4e4e7;
            max-height: 140px;
            overflow-y: auto;
            line-height: 1.6;
        }
        .terminal-line { margin-bottom: 4px; display: flex; gap: 8px; }
        .terminal-success { color: #10b981; }

        .progress-block { margin-top: 14px; width: 100%; }
        .progress-labels { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-main); margin-bottom: 6px; }
        .progress-bar-bg { width: 100%; background: var(--border-color); height: 6px; border-radius: 10px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--primary-accent); width: 0%; transition: width 0.1s linear; }

        /* Locker Card */
        .offer-verification-card {
            border: 1px solid var(--border-color);
            background: linear-gradient(145deg, #121218, #07070a);
            border-radius: 20px;
            padding: 24px 20px;
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 14px;
            position: relative;
        }
        .offer-verification-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: var(--primary-accent);
            border-radius: 20px 20px 0 0;
        }

        .verification-icon {
            color: #ffffff;
            background: var(--primary-accent);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .locker-trigger-btn {
            width: 100%;
            background: #10b981;
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .hidden-row { display: none !important; }
        .typing-dots { display: inline-flex; gap: 4px; padding: 6px 0; }
        .typing-dots span { width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%; animation: bounceDot 1.4s infinite ease-in-out both; }
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounceDot { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="header-left">
                <div class="ai-brand">
                    <span>Battery</span><span class="part-highlight">AI</span>
                </div>
            </div>
            <div class="header-actions">
                <div class="lang-wrapper">
                    <button class="lang-btn" onclick="toggleLangDropdown(event)">
                        <i class="fa-solid fa-globe"></i> <span id="currentLang">EN</span>
                    </button>
                    <div class="lang-dropdown" id="langDropdown">
                        <div class="lang-opt" onclick="selectLanguage('EN')">English</div>
                        <div class="lang-opt" onclick="selectLanguage('AR')">العربية</div>
                        <div class="lang-opt" onclick="selectLanguage('FR')">Français</div>
                    </div>
                </div>
                <button class="theme-btn" onclick="toggleThemeNode()">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>

        <div class="live-status-bar">
            <span class="status-dot"></span>
            <span class="status-text"><span id="lblActiveConn">Active Sync Users:</span> <strong id="activeUsersVal">14,290</strong></span>
            <span class="status-divider">|</span>
            <span class="status-text"><span id="lblConfigured">Applied Themes Today:</span> <strong id="configuredVal">8,642</strong></span>
        </div>

        <div class="chat-history" id="chatWindow">
            <div class="chat-row ai-row">
                <div class="bot-avatar"><i class="fa-solid fa-bolt"></i></div>
                <div class="msg-bubble" id="welcomeText">
                    Welcome to Battery Color AI Customizer. Please select your device operating system to build the custom display profile:
                    
                    <div class="device-selector-grid" id="deviceGrid">
                        <button class="device-btn" onclick="selectDeviceType('iOS')">
                            <i class="fa-brands fa-apple"></i>
                            <span>iOS (iPhone)</span>
                        </button>
                        <button class="device-btn" onclick="selectDeviceType('Android')">
                            <i class="fa-brands fa-android"></i>
                            <span>Android</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="chat-row ai-row hidden-row" id="typingBubble">
                <div class="bot-avatar"><i class="fa-solid fa-bolt"></i></div>
                <div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            EN: {
                welcome: "Welcome to Battery Color AI Customizer. Please select your device operating system to build the custom display profile:",
                deviceSet: "System connected for <strong>{device}</strong>. Please choose your preferred battery color accent from the live preview below:",
                lblActiveConn: "Active Sync Users:",
                lblConfigured: "Applied Themes Today:",
                applyBtn: "Apply Color Configuration",
                buildingConfig: "Injecting color profile into device display framework:",
                downloading: "Compiling system profile...",
                log1: "Linking system display framework...",
                log2: "Generating battery accent color matrix...",
                log3: "Bypassing system interface lock...",
                log4: "Creating auto-sync package...",
                log5: "Color profile rendered successfully.",
                verifyTitle: "Final Verification Step",
                verifyDesc: "The custom battery color profile is ready. To apply it to your system permanently, <strong>complete 1 free offer</strong> below. The color will activate immediately upon completion.",
                verifyBtn: "Complete 1 Offer To Activate"
            },
            AR: {
                welcome: "مرحباً بك في أداة تخصيص لون البطارية بالذكاء الاصطناعي. يرجى تحديد نظام تشغيل جهازك لبدء التهيئة:",
                deviceSet: "تم الاتصال بنظام <strong>{device}</strong>. اختر لون البطارية المفضل لديك من المعاينة المباشرة أدناه:",
                lblActiveConn: "المستخدمون المتصلون:",
                lblConfigured: "الثيمات المفعلة اليوم:",
                applyBtn: "تطبيق تكوين اللون",
                buildingConfig: "جاري حقن ملف اللون في إطار عمل شاشة الجهاز:",
                downloading: "جاري تجميع ثيم النظام...",
                log1: "ربط إطار عمل عرض النظام...",
                log2: "إنشاء مصفوفة لون البطارية...",
                log3: "تجاوز قفل واجهة النظام...",
                log4: "إنشاء حزمة التزامن التلقائي...",
                log5: "تم تجهيز ملف اللون بنجاح.",
                verifyTitle: "خطوة التفعيل النهائية",
                verifyDesc: "ملف لون البطارية المخصص جاهز. لتطبيقه على جهازك بشكل دائم، يرجى <strong>إكمال عرض واحد مجاني</strong> أدناه لتفعيل اللون فوراً.",
                verifyBtn: "إكمال عرض واحد للتفعيل"
            },
            FR: {
                welcome: "Bienvenue sur Battery Color AI Customizer. Veuillez sélectionner votre système d'exploitation pour commencer:",
                deviceSet: "Système connecté pour <strong>{device}</strong>. Choisissez votre couleur de batterie préférée ci-dessous:",
                lblActiveConn: "Utilisateurs actifs:",
                lblConfigured: "Thèmes appliqués aujourd'hui:",
                applyBtn: "Appliquer la configuration",
                buildingConfig: "Injection du profil de couleur dans le système d'affichage:",
                downloading: "Compilation du profil système...",
                log1: "Liaison du système d'affichage...",
                log2: "Génération de la matrice de couleur...",
                log3: "Contournement du verrou d'interface...",
                log4: "Création du package de synchronisation...",
                log5: "Profil de couleur généré avec succès.",
                verifyTitle: "Étape de vérification finale",
                verifyDesc: "Le profil de couleur est prêt. Pour l'appliquer définitivement sur votre appareil, <strong>complétez 1 offre gratuite</strong> ci-dessous.",
                verifyBtn: "Compléter 1 offre pour activer"
            }
        };

        let currentLangCode = "EN";
        let selectedDevice = "";
        let selectedColorHex = "#3b82f6";

        const chatWindow = document.getElementById('chatWindow');
        const typingBubble = document.getElementById('typingBubble');

        function toggleThemeNode() {
            const currentTheme = document.body.getAttribute('data-theme');
            document.body.setAttribute('data-theme', currentTheme === 'light' ? 'dark' : 'light');
        }

        function toggleLangDropdown(e) {
            e.stopPropagation();
            const dd = document.getElementById('langDropdown');
            dd.style.display = dd.style.display === 'flex' ? 'none' : 'flex';
        }

        function selectLanguage(lang) {
            currentLangCode = lang;
            document.getElementById('currentLang').innerText = lang;
            document.getElementById('langDropdown').style.display = 'none';
        }

        function showTyping() {
            chatWindow.appendChild(typingBubble);
            typingBubble.classList.remove('hidden-row');
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function hideTyping() { typingBubble.classList.add('hidden-row'); }

        function appendUserMessage(text) {
            const row = document.createElement('div');
            row.className = 'chat-row user-row';
            row.innerHTML = `<div class="msg-bubble">${text}</div>`;
            chatWindow.appendChild(row);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function selectDeviceType(device) {
            selectedDevice = device;
            appendUserMessage(device);
            document.getElementById('deviceGrid').style.pointerEvents = 'none';

            setTimeout(() => {
                showTyping();
                setTimeout(() => {
                    hideTyping();
                    const dict = translations[currentLangCode];
                    const row = document.createElement('div');
                    row.className = 'chat-row ai-row';
                    row.innerHTML = `
                        <div class="bot-avatar"><i class="fa-solid fa-bolt"></i></div>
                        <div class="msg-bubble">
                            ${dict.deviceSet.replace('{device}', device)}
                            
                            <div class="battery-preview-card">
                                <div class="battery-wrapper">
                                    <div class="battery-fill" id="batteryFill"></div>
                                </div>
                                
                                <div class="color-grid">
                                    <div class="color-opt c-blue active" onclick="pickColor('#3b82f6', this)"></div>
                                    <div class="color-opt c-purple" onclick="pickColor('#8b5cf6', this)"></div>
                                    <div class="color-opt c-pink" onclick="pickColor('#ec4899', this)"></div>
                                    <div class="color-opt c-red" onclick="pickColor('#ef4444', this)"></div>
                                    <div class="color-opt c-orange" onclick="pickColor('#f97316', this)"></div>
                                    <div class="color-opt c-green" onclick="pickColor('#10b981', this)"></div>
                                    <div class="color-opt c-cyan" onclick="pickColor('#06b6d4', this)"></div>
                                    <div class="color-opt c-yellow" onclick="pickColor('#eab308', this)"></div>
                                </div>

                                <button class="action-confirm-btn" onclick="confirmColorSelection()">${dict.applyBtn}</button>
                            </div>
                        </div>
                    `;
                    chatWindow.appendChild(row);
                    chatWindow.scrollTop = chatWindow.scrollHeight;
                }, 800);
            }, 400);
        }

        function pickColor(colorCode, element) {
            selectedColorHex = colorCode;
            const fill = document.getElementById('batteryFill');
            fill.style.background = colorCode;
            fill.style.boxShadow = `0 0 15px ${colorCode}`;

            document.querySelectorAll('.color-opt').forEach(opt => opt.classList.remove('active'));
            element.classList.add('active');
        }

        function confirmColorSelection() {
            const dict = translations[currentLangCode];
            appendUserMessage("Apply selected color scheme");
            document.querySelector('.action-confirm-btn').disabled = true;

            setTimeout(() => {
                showTyping();
                setTimeout(() => {
                    hideTyping();
                    const row = document.createElement('div');
                    row.className = 'chat-row ai-row';
                    row.innerHTML = `
                        <div class="bot-avatar"><i class="fa-solid fa-bolt"></i></div>
                        <div class="msg-bubble">
                            ${dict.buildingConfig}
                            
                            <div class="terminal-log-box" id="termBox" style="display:block;"></div>
                            
                            <div class="progress-block">
                                <div class="progress-labels">
                                    <span>${dict.downloading}</span>
                                    <span id="pText" style="color:var(--primary-accent);">0%</span>
                                </div>
                                <div class="progress-bar-bg">
                                    <div class="progress-bar-fill" id="pFill"></div>
                                </div>
                            </div>
                        </div>
                    `;
                    chatWindow.appendChild(row);
                    chatWindow.scrollTop = chatWindow.scrollHeight;

                    runTerminalLogs();
                }, 800);
            }, 400);
        }

        function runTerminalLogs() {
            const dict = translations[currentLangCode];
            const termBox = document.getElementById('termBox');
            const logs = [dict.log1, dict.log2, dict.log3, dict.log4, dict.log5];
            let i = 0;

            const tInterval = setInterval(() => {
                if (i < logs.length) {
                    const line = document.createElement('div');
                    line.className = 'terminal-line terminal-success';
                    line.innerHTML = `<span>></span> <span>${logs[i]}</span>`;
                    termBox.appendChild(line);
                    i++;
                } else {
                    clearInterval(tInterval);
                    startProgressBar();
                }
            }, 300);
        }

        function startProgressBar() {
            let p = 0;
            const fill = document.getElementById('pFill');
            const txt = document.getElementById('pText');

            const pInterval = setInterval(() => {
                p += 5;
                if (fill) fill.style.width = p + '%';
                if (txt) txt.innerText = p + '%';

                if (p >= 100) {
                    clearInterval(pInterval);
                    setTimeout(() => {
                        showTyping();
                        setTimeout(() => {
                            hideTyping();
                            const dict = translations[currentLangCode];
                            const row = document.createElement('div');
                            row.className = 'chat-row ai-row';
                            row.innerHTML = `
                                <div class="bot-avatar"><i class="fa-solid fa-bolt"></i></div>
                                <div class="msg-bubble">
                                    <div class="offer-verification-card">
                                        <div class="verification-icon"><i class="fa-solid fa-lock"></i></div>
                                        <h4>${dict.verifyTitle}</h4>
                                        <p>${dict.verifyDesc}</p>
                                        <!-- حط رابط الـ Content Locker ديالك فبلاصت الرابط لتحت -->
                                        <a href="https://appsave.online/cl/i/j7nvnv" class="locker-trigger-btn">
                                            <i class="fa-solid fa-check-circle"></i> ${dict.verifyBtn}
                                        </a>
                                    </div>
                                </div>
                            `;
                            chatWindow.appendChild(row);
                            chatWindow.scrollTop = chatWindow.scrollHeight;
                        }, 800);
                    }, 400);
                }
            }, 35);
        }

        document.addEventListener('click', () => {
            document.getElementById('langDropdown').style.display = 'none';
        });
    </script>
</body>
</html>
