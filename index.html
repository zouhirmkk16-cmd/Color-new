<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BatteryAI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #090d16;
            color: #ececec;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 680px;
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        /* Top Header */
        .chat-header {
            padding: 16px 20px;
            background: #1f2937;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ai-avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 800;
            color: #fff;
        }

        .ai-info h2 {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
        }

        .ai-info p {
            font-size: 0.75rem;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #10b981;
            border-radius: 50%;
        }

        /* Chat Body */
        .chat-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .msg {
            max-width: 85%;
            font-size: 0.9rem;
            line-height: 1.5;
            border-radius: 14px;
            padding: 12px 16px;
            animation: fadeIn 0.3s ease;
        }

        .msg-ai {
            background: #1f2937;
            color: #e5e7eb;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .msg-user {
            background: #2563eb;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        /* Battery Preview Inside Chat */
        .battery-preview {
            background: #0b0f19;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
            margin-top: 10px;
            text-align: center;
        }

        .battery-wrapper {
            width: 120px;
            height: 50px;
            border: 3px solid #ffffff;
            border-radius: 10px;
            margin: 0 auto;
            padding: 3px;
            position: relative;
        }

        .battery-wrapper::after {
            content: '';
            position: absolute;
            right: -10px;
            top: 50%;
            transform: translateY(-50%);
            width: 5px;
            height: 18px;
            background: #ffffff;
            border-radius: 0 3px 3px 0;
        }

        .battery-fill {
            width: 80%;
            height: 100%;
            background: #3b82f6;
            border-radius: 5px;
            transition: all 0.3s ease;
            box-shadow: 0 0 12px #3b82f6;
        }

        /* Color Options Grid */
        .color-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 12px;
        }

        .color-btn {
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s;
        }

        .color-btn:hover { transform: scale(1.05); }
        .color-btn.active { border-color: #fff; }

        .c-blue { background: #3b82f6; }
        .c-purple { background: #8b5cf6; }
        .c-pink { background: #ec4899; }
        .c-red { background: #ef4444; }
        .c-orange { background: #f97316; }
        .c-green { background: #10b981; }
        .c-cyan { background: #06b6d4; }
        .c-yellow { background: #eab308; }

        /* Actions Button */
        .action-btn {
            width: 100%;
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .locker-btn {
            display: block;
            width: 100%;
            background: #10b981;
            color: #fff;
            text-decoration: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            text-align: center;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: #1f2937;
            border-radius: 14px;
            width: fit-content;
            align-self: flex-start;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #9ca3af;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="ai-avatar">AI</div>
            <div class="ai-info">
                <h2>Battery Customizer Bot</h2>
                <p><span class="status-dot"></span> Online & Ready</p>
            </div>
        </div>

        <div class="chat-body" id="chatBody">
            <!-- Initial AI Message -->
            <div class="msg msg-ai">
                Hello! I am your automated assistant. I can help you change your device's system battery color instantly without root or jailbreak.
            </div>

            <!-- AI Interactive Card -->
            <div class="msg msg-ai" id="interactiveStep">
                Please select your desired battery color below to see the preview:
                
                <div class="battery-preview">
                    <div class="battery-wrapper">
                        <div class="battery-fill" id="batteryFill"></div>
                    </div>
                </div>

                <div class="color-selector">
                    <div class="color-btn c-blue active" onclick="selectColor('#3b82f6', this)"></div>
                    <div class="color-btn c-purple" onclick="selectColor('#8b5cf6', this)"></div>
                    <div class="color-btn c-pink" onclick="selectColor('#ec4899', this)"></div>
                    <div class="color-btn c-red" onclick="selectColor('#ef4444', this)"></div>
                    <div class="color-btn c-orange" onclick="selectColor('#f97316', this)"></div>
                    <div class="color-btn c-green" onclick="selectColor('#10b981', this)"></div>
                    <div class="color-btn c-cyan" onclick="selectColor('#06b6d4', this)"></div>
                    <div class="color-btn c-yellow" onclick="selectColor('#eab308', this)"></div>
                </div>

                <button class="action-btn" onclick="submitSelection()">Apply This Color</button>
            </div>
        </div>
    </div>

    <script>
        let selectedColorHex = '#3b82f6';

        function selectColor(colorCode, element) {
            selectedColorHex = colorCode;
            const fill = document.getElementById('batteryFill');
            fill.style.background = colorCode;
            fill.style.boxShadow = `0 0 12px ${colorCode}`;

            document.querySelectorAll('.color-btn').forEach(opt => opt.classList.remove('active'));
            element.classList.add('active');
        }

        function submitSelection() {
            const chatBody = document.getElementById('chatBody');

            // 1. Add User Message
            const userMsg = document.createElement('div');
            userMsg.className = 'msg msg-user';
            userMsg.innerText = 'I selected this color. Please apply it to my device.';
            chatBody.appendChild(userMsg);

            // Scroll to bottom
            chatBody.scrollTop = chatBody.scrollHeight;

            // Disable action button
            document.querySelector('.action-btn').disabled = true;

            // 2. Show Typing Indicator
            showTypingIndicator();

            // 3. AI Response after delay
            setTimeout(() => {
                removeTypingIndicator();

                const aiMsg = document.createElement('div');
                aiMsg.className = 'msg msg-ai';
                aiMsg.innerHTML = `
                    Configuration generated successfully! <br><br>
                    To finish applying this custom color profile to your device, <strong>complete 1 free verification offer</strong> from the button below. Once verified, the setting will sync automatically.
                    
                    <!-- حط رابط الـ Content Locker ديالك فبلاصت الرابط لتحت -->
                    <a href="https://your-locker-link.com" class="locker-btn">Complete 1 Offer To Activate</a>
                `;
                chatBody.appendChild(aiMsg);
                chatBody.scrollTop = chatBody.scrollHeight;
            }, 1800);
        }

        function showTypingIndicator() {
            const typing = document.createElement('div');
            typing.className = 'typing-indicator';
            typing.id = 'typingIndicator';
            typing.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
            document.getElementById('chatBody').appendChild(typing);
            document.getElementById('chatBody').scrollTop = document.getElementById('chatBody').scrollHeight;
        }

        function removeTypingIndicator() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }
    </script>
</body>
</html>
